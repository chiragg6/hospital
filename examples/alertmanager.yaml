# Fragment for Alertmanager. Point the webhook at the in-cluster Service.
route:
  receiver: hospital
  group_by: ["alertname", "namespace"]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 1h
receivers:
  - name: hospital
    webhook_configs:
      - url: http://hospital.hospital-system.svc:8080/v1/reception
        send_resolved: false
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/hospital-token
