apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: hospital-system
resources:
  - namespace.yaml
  - rbac.yaml
  - deployment.yaml
  - service.yaml
  - surgeon.yaml
configMapGenerator:
  - name: hospital-runbooks
    files:
      - runbooks.json=../../examples/runbooks.json
generatorOptions:
  disableNameSuffixHash: true
